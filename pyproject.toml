[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpg-chronicle"
version = "0.0.0"
description = "Local-first tabletop RPG transcription and campaign chronicle pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Karl Piteira" }]
dependencies = []

[dependency-groups]
dev = [
  "jsonschema>=4.23",
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
rpg-chronicle = "rpg_chronicle.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
