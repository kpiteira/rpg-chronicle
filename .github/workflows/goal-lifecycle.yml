name: goal-lifecycle

on:
  issues:
    # `edited` is here from #38. A goal-check verdict is bound to a hash of the goal body,
    # so editing the body after a passing check is the case the binding exists to catch --
    # and without this trigger the binding was sound and unreachable, reported only at the
    # next label event. The operator authorised the workflow run it costs.
    types: [opened, closed, edited, labeled, unlabeled, reopened]

permissions:
  issues: write

jobs:
  enforce-single-active-goal:
    # Not on `edited`: editing a body cannot change how many goals a role holds, and this
    # job would spend a run to recount what the label events already counted. `edited` was
    # added for the check below, which is the only job a body change has anything to say to.
    if: github.event.action != 'closed' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any role holds more than one active goal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Roles are derived from the agent:* labels on open active goals rather
          # than hard-coded, so a role added later is covered automatically.
          rows=$(gh issue list --state open --label "goal:active" \
            --json labels \
            --jq '[.[].labels[].name | select(startswith("agent:"))]
                  | group_by(.) | map("\(.[0]) \(length)") | .[]')
          status=0
          while read -r role count; do
            [ -z "${role:-}" ] && continue
            echo "${role}: ${count} active"
            if [ "$count" -gt 1 ]; then
              echo "::error::${role} has ${count} active goals; exactly one is allowed"
              status=1
            fi
          done <<< "$rows"
          exit $status

  require-goal-check:
    # An active goal must carry a passing goal-check verdict bound to its current body.
    # This job never invokes a model: scripts/check-goal.sh does that locally, and this
    # only looks for what it left behind. Like every other control here it reports rather
    # than prevents -- a failed check on an issue event does not remove the label.
    if: github.event.action != 'closed' && contains(github.event.issue.labels.*.name, 'goal:active')
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's, they do not add to them. This job
    # needs contents:read for the checkout that brings scripts/goal-body-hash.sh, and
    # issues:read for the comments; it writes nothing.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - name: Fail if the active goal has no matching goal-check verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          body_hash=$(scripts/goal-body-hash.sh "$ISSUE")

          # Select whole comments carrying the marker, so a "pass" elsewhere in the
          # discussion cannot be read as this goal's verdict -- and take the last one, so
          # a re-check that now blocks is not satisfied by an earlier passing verdict for
          # the same body.
          select_marker() {
            gh issue view "$ISSUE" --json comments \
              --jq "[.comments[].body | select(contains(\"$1 body:${body_hash}\"))] | last // empty"
          }

          if [ -n "$(select_marker goal-check-override)" ]; then
            echo "goal check overridden by the operator for body ${body_hash}"
            exit 0
          fi

          verdict=$(select_marker goal-checker)

          if [ -z "$verdict" ]; then
            echo "::error::#${ISSUE} is active with no goal-check verdict for its current body (${body_hash}). Run scripts/check-goal.sh ${ISSUE}."
            exit 1
          fi

          # Parse the fenced JSON rather than grepping the comment. The checker quotes the
          # goal's own text into its findings, so a goal that discusses verdict JSON would
          # put the pass substring inside a blocking verdict. Unparseable output fails.
          state=$(printf '%s' "$verdict" \
            | sed -n '/^```json$/,/^```$/p' | sed '1d;$d' \
            | jq -er '.verdict' 2>/dev/null || true)
          if [ "$state" != "pass" ]; then
            echo "::error::#${ISSUE} carries a blocking or malformed goal-check verdict for its current body."
            exit 1
          fi
          echo "goal check passes for body ${body_hash}"

  notify-tpm-on-completion:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Post completed goal to the TPM inbox
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ' ') }}
        run: |
          set -euo pipefail
          case "$LABELS" in *agent:*) ;; *) echo "not a specialist issue"; exit 0 ;; esac
          case "$LABELS" in *goal:*) ;; *) echo "not a lifecycle-labelled goal"; exit 0 ;; esac

          inbox=$(gh issue list --state open --label "tpm:inbox" \
            --json number --jq '.[0].number // empty')
          if [ -z "$inbox" ]; then
            echo "::warning::no open issue labelled tpm:inbox; create one to close the loop"
            exit 0
          fi

          {
            printf 'Goal #%s closed: %s\n\n' "$ISSUE" "$TITLE"
            printf '%s\n' "$URL"
            printf 'Labels: %s\n\n' "$LABELS"
            printf 'TPM: assess outcome, architecture impact, and milestone progress, '
            printf 'then decide whether to activate the next substantial goal for this '
            printf 'specialist.\n'
          } > /tmp/tpm-note.md

          gh issue comment "$inbox" --body-file /tmp/tpm-note.md
